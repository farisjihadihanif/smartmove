<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#361254" />
    <meta name="description" content="SmartMove Medan – navigasi, info lalu lintas, dan perencana perjalanan kota Medan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Open+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SmartMove Medan</title>
    <script>
      // Mode gelap (T-110): pasang tema sebelum halaman digambar supaya tidak berkedip. Sama dengan src/lib/tema.js.
      try {
        var p = localStorage.getItem('smartmove-tema')
        var g = p === 'gelap' || (p !== 'terang' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = g ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
